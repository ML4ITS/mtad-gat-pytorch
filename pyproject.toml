[project]
name = "mtad-gat-pytorch"
version = "0.1.0"
description = "PyTorch implementation of MTAD-GAT: Multivariate Time-series Anomaly Detection via Graph Attention Networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "more-itertools",
    "matplotlib",
    "numpy",
    "plotly",
    "polars",
    "scikit-learn",
    "scipy",
    "tensorboard",
    "torch",
    "tqdm",
]

[dependency-groups]
dev = [
    "marimo",
    "prek",
    "pyrefly",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CI runs on linux, where the default wheel of torch carries the CUDA libraries.
# The CPU wheel is much smaller. macOS keeps the default wheel, which has MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 120
extend-exclude = ["spot.py"]  # vendored from OmniAnomaly, kept close to upstream

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = [
    "F403",  # the training scripts rely on `from utils import *`
    "F405",
]

[tool.pyrefly]
# The tests hold the loose types of plotly, such as Figure.data. Those give errors that
# no annotation in this project can correct.
project-excludes = ["spot.py", "tests/**", ".venv/**"]
